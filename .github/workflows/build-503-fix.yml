name: Build SideStore 503 Fix

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/build-503-fix.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build patched SideStore IPA
    runs-on: macos-26

    steps:
      - name: Checkout SideStore
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Xcode 26.2
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: '26.2'

      - name: Install build tools
        run: brew install ldid xcbeautify

      - name: Patch SideSign GrandSlam requests
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "Dependencies/SideSign/"
              "Sources/DeveloperPortal/Authentication.swift"
          )

          text = path.read_text()

          start_marker = (
              "        let (data, response): "
              "(Data, URLResponse)\n"
          )

          end_marker = (
              "        guard !data.isEmpty else {\n"
          )

          start = text.find(start_marker)

          if start == -1:
              raise SystemExit(
                  "Could not locate beginning of "
                  "sendAuthenticationRequest network block"
              )

          end = text.find(end_marker, start)

          if end == -1:
              raise SystemExit(
                  "Could not locate end of "
                  "sendAuthenticationRequest network block"
              )

          lines = [
              "        // GrandSlam 503 workaround.",
              "        // Give every request its own URLSession.",
              "        let maximumAttempts = 5",
              "        var finalData: Data?",
              "        var finalResponse: URLResponse?",
              "",
              "        for attempt in 0..<maximumAttempts {",
              "            let attemptSession = URLSession(",
              "                configuration: .ephemeral",
              "            )",
              "",
              "            do {",
              "                let (attemptData, attemptResponse) =",
              "                    try await attemptSession.data(",
              "                        for: request",
              "                    )",
              "",
              "                attemptSession.finishTasksAndInvalidate()",
              "",
              "                let attemptStatusCode =",
              "                    (attemptResponse as? HTTPURLResponse)?",
              "                        .statusCode ?? 0",
              "",
              "                if (500...599).contains(",
              "                    attemptStatusCode",
              "                ) && attempt < maximumAttempts - 1 {",
              "                    let delaySeconds = min(",
              "                        1 << attempt,",
              "                        8",
              "                    )",
              "",
              "                    debugLog(",
              "                        \"[SideSign] GrandSlam HTTP \" +",
              "                        \"\\(attemptStatusCode); \" +",
              "                        \"retrying on fresh connection\"",
              "                    )",
              "",
              "                    try await Task.sleep(",
              "                        nanoseconds:",
              "                            UInt64(delaySeconds) *",
              "                            1_000_000_000",
              "                    )",
              "",
              "                    continue",
              "                }",
              "",
              "                finalData = attemptData",
              "                finalResponse = attemptResponse",
              "                break",
              "            } catch {",
              "                attemptSession.invalidateAndCancel()",
              "                debugLog(",
              "                    \"[SideSign] auth network error: \" +",
              "                    \"\\(error)\"",
              "                )",
              "                throw error",
              "            }",
              "        }",
              "",
              "        guard let data = finalData,",
              "              let response = finalResponse else {",
              "            throw URLError(.badServerResponse)",
              "        }",
              "",
              "        let httpResponse =",
              "            response as? HTTPURLResponse",
              "",
              "        let statusCode =",
              "            httpResponse?.statusCode ?? 0",
              "",
              "        if (500...599).contains(statusCode) {",
              "            throw ServerError.badServerResponse(",
              "                reason:",
              "                    \"GrandSlam returned HTTP \" +",
              "                    \"\\(statusCode) after \" +",
              "                    \"\\(maximumAttempts) attempts\",",
              "                jsonPayload:",
              "                    \"\\(data.count) bytes\"",
              "            )",
              "        }",
              ""
          ]

          replacement = "\n".join(lines) + "\n"

          new_text = (
              text[:start] +
              replacement +
              text[end:]
          )

          path.write_text(new_text)

          if "URLSession(configuration: .ephemeral)" in new_text:
              print("GrandSlam fresh-session patch applied.")
          elif "configuration: .ephemeral" in new_text:
              print("GrandSlam fresh-session patch applied.")
          else:
              raise SystemExit("Patch verification failed.")
          PY
      - name: Verify patch
        run: |
          grep -q 'URLSession(configuration: .ephemeral)' \
            Dependencies/SideSign/Sources/DeveloperPortal/Authentication.swift

          grep -q 'maximumAttempts = 5' \
            Dependencies/SideSign/Sources/DeveloperPortal/Authentication.swift

          git -C Dependencies/SideSign diff --check

      - name: Build SideStore IPA
        run: python3 scripts/ci/workflow.py build

      - name: Rename IPA
        run: mv SideStore.ipa SideStore-503-fix.ipa

      - name: Upload patched IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-503-fix
          path: SideStore-503-fix.ipa
          if-no-files-found: error
          retention-days: 7
